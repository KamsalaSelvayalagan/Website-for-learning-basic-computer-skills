<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Learn Microsoft Office</title>
    <link rel="stylesheet" href="signupPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>Learn Microsoft Office</header>

    <nav>
        <a href="Home.html">Home</a>
        <a href="About.html" target="_blank">About</a>
    </nav>

    <div class="container">
        <h2 style="text-align:center; color:#0056b3;">Login to Your Account</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" name="userName" placeholder="Enter your username" required>
            </div>

            <div class="form-group" style="position:relative;">
                <label for="loginPass">Password</label>
                <input type="password" id="loginPass" name="pass" placeholder="Enter your password" required>
                <span class="password-toggle" onclick="togglePassword('loginPass', this)"></span>
            </div>

            <div id="passwordMessage" style="color:red; text-align:center; margin-bottom:10px;"></div>

            <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember" style="margin:0;">Remember me</label>
            </div>

            <div class="form-group">
                <button type="submit" class="btn">Login</button>
            </div>

            <div class="form-group" style="text-align:center;">
                <p>Or login with <a href="#">Facebook</a> / <a href="#">Google</a></p>
            </div>

            <div class="form-group" style="text-align:center;">
                <p>Not a member? <a href="signupPage.html">Sign up</a></p>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Learn Microsoft Office | Your Path to Productivity</p>
    </footer>

    <script>
        // Toggle password visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.add("active");
            } else {
                input.type = "password";
                icon.classList.remove("active");
            }
        }

        // Handle Login
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Stop form refresh

            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPass").value.trim();
            const passwordMessage = document.getElementById("passwordMessage");

            // Empty fields check
            if (username === "" || password === "") {
                passwordMessage.innerHTML = "Please enter both username and password.";
                return;
            }

            // Password strength check (same logic as signup)
            const hasLower = /[a-z]/.test(password);
            const hasUpper = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasLength = password.length >= 8;

            if (!hasLower || !hasUpper || !hasNumber || !hasLength) {
                passwordMessage.innerHTML = 
                    "Password must include at least:<br>- One lowercase letter<br>- One uppercase letter<br>- One number<br>- Minimum 8 characters.";
                return;
            }

            // All validations passed
            window.location.href = "contentPage.html";
        });
    </script>
</body>
</html>
