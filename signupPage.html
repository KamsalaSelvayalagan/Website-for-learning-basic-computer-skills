<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Learn Microsoft Office</title>
    <link rel="stylesheet" href="signupPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <header>Learn Microsoft Office</header>

    <nav>
        <a href="Home.html">Home</a>
        <a href="About.html" target="_blank">About</a>
    </nav>

    <div class="container">
        <h2 style="text-align:center; color:#0056b3;">Create Your Account</h2>

        <form id="signupForm" method="post">
            <div class="form-group">
                <label for="newUserName">Username</label>
                <input type="text" id="newUserName" name="newUserName" required>
            </div>

            <div class="form-group" style="position:relative;">
                <label for="password">Password</label>
                <input type="password" id="password" name="newPass" placeholder="Create password" required>
                <span class="password-toggle" onclick="togglePassword('password', this)"></span>
            </div>

            <div id="message">
                <h3>Password must contain the following:</h3>
                <p id="letter" class="invalid">A <b>lowercase</b> letter</p>
                <p id="capital" class="invalid">A <b>capital (uppercase)</b> letter</p>
                <p id="number" class="invalid">A <b>number</b></p>
                <p id="length" class="invalid">Minimum <b>8 characters</b></p>
            </div>

            <div class="form-group" style="position:relative;">
                <label for="confirmPass">Confirm Password</label>
                <input type="password" id="confirmPass" name="confirmPass" placeholder="Confirm password" required>
                <span class="password-toggle" onclick="togglePassword('confirmPass', this)"></span>
            </div>

            <div id="passwordMessage" style="color:red; text-align:center; margin-bottom:10px;"></div>

            <div class="form-group">
                <button type="submit" class="btn">Sign Up</button>
            </div>

            <div class="form-group" style="text-align:center;">
                <p>Already have an account? <a href="login.html" id="loginLink">Sign in</a></p>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 Learn Microsoft Office | Your Path to Productivity</p>
    </footer>

    <script>
        // Toggle password visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.add("active");
            } else {
                input.type = "password";
                icon.classList.remove("active");
            }
        }

        // Password validation
        var myInput = document.getElementById("password");
        var letter = document.getElementById("letter");
        var capital = document.getElementById("capital");
        var number = document.getElementById("number");
        var length = document.getElementById("length");

        myInput.onfocus = function() {
            document.getElementById("message").style.display = "block";
        }
        myInput.onblur = function() {
            document.getElementById("message").style.display = "none";
        }
        myInput.onkeyup = function() {
            var lowerCaseLetters = /[a-z]/g;
            letter.classList.toggle("valid", myInput.value.match(lowerCaseLetters));
            letter.classList.toggle("invalid", !myInput.value.match(lowerCaseLetters));

            var upperCaseLetters = /[A-Z]/g;
            capital.classList.toggle("valid", myInput.value.match(upperCaseLetters));
            capital.classList.toggle("invalid", !myInput.value.match(upperCaseLetters));

            var numbers = /[0-9]/g;
            number.classList.toggle("valid", myInput.value.match(numbers));
            number.classList.toggle("invalid", !myInput.value.match(numbers));

            length.classList.toggle("valid", myInput.value.length >= 8);
            length.classList.toggle("invalid", myInput.value.length < 8);
        }

        function validatePassword() {
            let isValid = true;
            let messages = [];
            if (!letter.classList.contains("valid")) { messages.push("Password must contain a lowercase letter."); isValid = false; }
            if (!capital.classList.contains("valid")) { messages.push("Password must contain an uppercase letter."); isValid = false; }
            if (!number.classList.contains("valid")) { messages.push("Password must contain a number."); isValid = false; }
            if (!length.classList.contains("valid")) { messages.push("Password must be at least 8 characters long."); isValid = false; }
            if (!isValid) document.getElementById("passwordMessage").innerHTML = messages.join("<br>");
            return isValid;
        }

        // Handle signup
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            if (!validatePassword()) {
                return false;
            }

            const password = document.getElementById("password").value.trim();
            const confirmPass = document.getElementById("confirmPass").value.trim();
            const username = document.getElementById("newUserName").value.trim();
            const passwordMessage = document.getElementById("passwordMessage");

            if (!username) {
                passwordMessage.innerHTML = "Please enter a username.";
                return false;
            }

            if (password !== confirmPass) {
                passwordMessage.innerHTML = "Passwords do not match.";
                return false;
            }

            // All validations passed
            window.location.href = "contentPage.html";
        });
    </script>
</body>
</html>
